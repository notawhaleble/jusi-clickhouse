[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jusi-clickhouse"
dynamic = ["version"]
description = "ClickHouse exact-provider plugin for Jusi 1.0 SQL"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Jusi contributors" }
]
dependencies = [
  "clickhouse-connect>=0.7",
  "jusi>=1.0.2,<2",
  "jusi-sql>=0.2,<0.3",
  "visidata>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.entry-points."jusi.plugins.v1"]
clickhouse = "jusi_clickhouse.catalog:catalog_entry"

[tool.hatch.version]
path = "src/jusi_clickhouse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jusi_clickhouse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
